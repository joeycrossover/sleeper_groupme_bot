name: Weekly Power Rankings

on:
  schedule:
    # GitHub cron is UTC only, so both are scheduled and the script's
    # 9am-ET guard decides which one actually posts.
    - cron: "0 13 * * 2"   # 9:00 EDT (Sep–Nov)
    - cron: "0 14 * * 2"   # 9:00 EST (Nov–Jan)
  workflow_dispatch:
    inputs:
      week:
        description: "Force a specific week (blank = auto-detect)"
        required: false
        type: string
      dry_run:
        description: "Print instead of posting to GroupMe"
        required: false
        default: false
        type: boolean
      skip_x:
        description: "Skip the X post (GroupMe only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install chromium
        run: playwright install --with-deps chromium

      - name: Post rankings
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # manual runs skip the clock guard and the already-posted guard
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          POST_X: ${{ inputs.skip_x && '' || '1' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python gburg_bot.py

      - name: Upload graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-week-${{ inputs.week || 'auto' }}
          path: out/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit updated history
        run: |
          git config user.name "gburgfantasybot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Power rankings history update"
          git push
