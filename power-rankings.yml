name: Weekly Power Rankings

on:
  schedule:
    # GitHub cron is UTC only, so both are scheduled and the script's
    # 9am-ET guard decides which one actually posts.
    - cron: "0 13 * * 2"   # 9:00 EDT (Sep–Nov)
    - cron: "0 14 * * 2"   # 9:00 EST (Nov–Jan)
  workflow_dispatch:
    inputs:
      week:
        description: "Force a specific week (blank = auto-detect)"
        required: false
        type: string
      dry_run:
        description: "Print instead of posting to GroupMe"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post rankings
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # manual runs skip the clock guard and the already-posted guard
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python gburg_bot.py

      - name: Commit updated history
        run: |
          git config user.name "gburgfantasybot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Power rankings history update"
          git push
